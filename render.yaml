services:
  # Web Service running FastAPI + React Static Bundle
  - type: web
    name: friendship-test
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: friendship-test-db
          property: connectionString
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: PUBLIC_BASE_URL
        sync: false # Set in Render dashboard or leave unset to auto-detect incoming HTTPS host

databases:
  # PostgreSQL Database on Render
  - name: friendship-test-db
    databaseName: friendship_test
    user: friendship_admin
    plan: free
    region: oregon
